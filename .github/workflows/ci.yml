name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

jobs:
  # Rust checks for the non-Tauri crates. The wire-app (Tauri GUI) crate needs
  # GTK/WebKit system libraries to build and is covered by the release workflow,
  # so it is intentionally excluded here.
  rust:
    name: Rust (core, cli, web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -p wire-core -p wire-cli -p wire-web -- -D warnings
      - name: Test
        run: cargo test --locked -p wire-core -p wire-cli -p wire-web

  # UI lint + production build.
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui

  # Build the single-container web playground image end-to-end.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build wire-web image
        run: docker build -f crates/wire-web/Dockerfile -t wire-web .
      - name: Smoke-test the image
        run: |
          docker run -d --name wire-web -e PORT=8787 -p 8787:8787 wire-web
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          docker logs wire-web
          if [ "${ready:-0}" != "1" ]; then
            echo "::error::container did not become healthy (see logs above)"
            docker rm -f wire-web
            exit 1
          fi
          # Exercise an API route to confirm the app is actually serving.
          curl -fsS -X POST http://localhost:8787/api/list_samples \
            -H 'content-type: application/json' -d '{}' >/dev/null
          docker rm -f wire-web
